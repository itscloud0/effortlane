name: tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Python version
        run: python3 --version
      - name: Verify public evidence graphic
        run: python3 scripts/render_evidence.py --check
      - name: Unit tests
        run: python3 -m unittest discover -s . -p 'test_*.py' -q
      - name: Lanes on the macOS system Python
        run: /usr/bin/python3 --version && /usr/bin/python3 -m unittest test_lane test_lane_claude test_lane_guard -q
      - name: Compile runtime modules
        run: python3 -m py_compile core.py manage.py metrics.py trials.py claude_shadow.py rpc_adapter.py desktop_bootstrap.py cli_bridge.py transport.py lane.py lane_claude.py lane_guard.py lane_xray.py
